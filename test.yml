name: TaskFlow CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build application
      - name: Build application
        run: npm run build

      # 5. Build Docker image
      - name: Build Docker image
        run: docker build -t taskflow-app:latest .

      # 6. Login Docker Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Push Docker image
      - name: Push Docker image
        run: |
          docker tag taskflow-app:latest ${{ secrets.DOCKER_USERNAME }}/taskflow-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-app:latest